apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    # Own server block so CoreDNS tags 5gc traffic with zone="5gc.3gppnetwork.org."
    # in its metrics; a single ".:53" block reports every query as zone=".".
    5gc.3gppnetwork.org.:53 {
        errors
        prometheus :9153
        forward . 10.96.0.11 172.18.1.0 {
           max_concurrent 1000
           policy sequential
        }
        reload
    }

    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . 10.96.0.11 172.18.1.0 /etc/resolv.conf {
           max_concurrent 1000
           policy sequential
        }
        loop
        reload
        loadbalance
    }

