---
image:
  pullPolicy: IfNotPresent

rbac:
  create: true

isClusterService: true

service:
  clusterIP: 10.96.0.11


servers:
  # Own server block so CoreDNS tags 5gc traffic with zone="5gc.3gppnetwork.org."
  - zones:
      - zone: 5gc.3gppnetwork.org.
    port: 53
    plugins:
      - name: errors
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: reload
      - name: loadbalance
      # setup-kind.sh appends the other clusters' pdns-ext-service IPs to this line
      - name: forward
        parameters: . 10.96.0.12
        configBlock: |-
          policy sequential
  - zones:
      - zone: .
    port: 53
    plugins:
      - name: errors
      # Serves a /health endpoint on :8080, required for livenessProbe
      - name: health
        configBlock: |-
          lameduck 5s
      # Serves a /ready endpoint on :8181, required for readinessProbe
      - name: ready
      # Serves a /metrics endpoint on :9153, required for serviceMonitor
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: loop
      - name: reload
      - name: loadbalance
      - name: forward
        parameters: . 1.1.1.1
