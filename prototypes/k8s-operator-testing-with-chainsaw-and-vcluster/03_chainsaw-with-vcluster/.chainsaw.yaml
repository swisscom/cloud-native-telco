# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/configuration-chainsaw-v1alpha2.json
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: demo-vcluster
spec:
  timeouts:
    # fresh vcluster: images and operators need time to come up
    assert: 5m
    exec: 1m
  cleanup:
    # the whole vcluster is thrown away after the run, no need to clean up
    skipDelete: true
  execution:
    parallel: 4
